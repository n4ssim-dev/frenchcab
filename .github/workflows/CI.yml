name: CI
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Tests de la PR {0} vers {1}', github.head_ref, github.base_ref)
      || format('CI sur {0}', github.ref_name) }}

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Détecte quels microservices ont été modifiés (PR vers dev, ou push sur dev)
  changements:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ms_api_metier: ${{ steps.filtre.outputs.ms_api_metier }}
      gateway: ${{ steps.filtre.outputs.gateway }}
      ms_front: ${{ steps.filtre.outputs.ms_front }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filtre
        with:
          filters: |
            ms_api_metier:
              - 'ms_api_metier/**'
            gateway:
              - 'gateway/**'
            ms_front:
              - 'ms_front/**'

  ms_api_metier:
    needs: changements
    if: needs.changements.outputs.ms_api_metier == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms_api_metier
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: pytest

  gateway:
    needs: changements
    if: needs.changements.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      # Pas encore de tests : on vérifie au moins la syntaxe de chaque fichier
      - run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

  ms_front:
    needs: changements
    if: needs.changements.outputs.ms_front == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms_front
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npx ng test --watch=false

  # Build + push des images sur Docker Hub dès que du code est présent sur main
  publication-dockerhub:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, ms_api_metier, ms_front]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frenchcab:${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
