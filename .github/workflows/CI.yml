name: CI
run-name: Tests de la PR ${{ github.head_ref }} vers ${{ github.base_ref }}

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Détecte quels microservices ont été modifiés dans la PR
  changements:
    runs-on: ubuntu-latest
    outputs:
      ms_api_metier: ${{ steps.filtre.outputs.ms_api_metier }}
      gateway: ${{ steps.filtre.outputs.gateway }}
      ms_front: ${{ steps.filtre.outputs.ms_front }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filtre
        with:
          filters: |
            ms_api_metier:
              - 'ms_api_metier/**'
            gateway:
              - 'gateway/**'
            ms_front:
              - 'ms_front/**'

  ms_api_metier:
    needs: changements
    if: needs.changements.outputs.ms_api_metier == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms_api_metier
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: pytest

  gateway:
    needs: changements
    if: needs.changements.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      # Pas encore de tests : on vérifie au moins la syntaxe de chaque fichier
      - run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

  ms_front:
    needs: changements
    if: needs.changements.outputs.ms_front == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms_front
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npx ng test --watch=false
