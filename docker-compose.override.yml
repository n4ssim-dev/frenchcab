services:

  gateway:
    build: ./gateway
    volumes:
      - ./gateway:/app
      - /app/node_modules

  ms_api_metier:
    build: ./ms_api_metier
    volumes:
      - ./ms_api_metier:/app

  ms_front:
    build:
      context: ./ms_front
      args:
        BUILD_CONFIG: development
    volumes:
      - ./ms_front:/app
      - /app/node_modules
    depends_on:
      - gateway